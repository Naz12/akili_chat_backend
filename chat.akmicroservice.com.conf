server {
    server_name chat.akmicroservice.com;

    root /home/deploy_user_dagi/services/akili/akili_chat_backend/public;
    index index.php index.html;

    access_log /var/log/nginx/chat.akmicroservice.access.log;
    error_log  /var/log/nginx/chat.akmicroservice.error.log;

    # Allow file uploads up to 10MB
    client_max_body_size 10M;
    
    # Timeout configurations for long-running AI requests
    client_header_timeout 300s;
    client_body_timeout 300s;
    send_timeout 300s;
    fastcgi_read_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Laravel front-controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Timeout for PHP processing
        fastcgi_read_timeout 300s;
    }

    location ~ /\.ht {
        deny all;
    }

    # WebSocket proxy for Soketi
    location /app/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/chat.akmicroservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.akmicroservice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chat.akmicroservice.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name chat.akmicroservice.com;
    return 404;
}