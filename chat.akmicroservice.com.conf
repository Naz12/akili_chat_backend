server {
    server_name chat.akmicroservice.com;

    root /home/deploy_user_dagi/services/akili_chat_backend/public;
    index index.php index.html;

    access_log /var/log/nginx/chat.akmicroservice.access.log;
    error_log  /var/log/nginx/chat.akmicroservice.error.log;

    # Laravel front-controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler with CORS headers
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Add CORS headers to all PHP responses
        # Using 'always' ensures headers are added even on error responses
        # This will handle both regular requests and OPTIONS preflight
        add_header 'Access-Control-Allow-Origin' 'https://akili.akmicroservice.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/chat.akmicroservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.akmicroservice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chat.akmicroservice.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name chat.akmicroservice.com;
    return 404;
}
